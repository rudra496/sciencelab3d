name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.41.1
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
          OPENAI_KEY: *** secrets.ZAI_API_KEY }}
          OPENAI.API_BASE: "https://api.z.ai/api/coding/paas/v4"
          config.model: "openai/glm-5.2"
          config.fallback_models: '["openai/glm-4.7"]'
          config.custom_model_max_tokens: "16384"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
